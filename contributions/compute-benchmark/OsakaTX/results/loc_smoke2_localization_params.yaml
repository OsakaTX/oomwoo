slam_toolbox:
  ros__parameters:
    # OOMWOO benchmark params for localization-only mode (ADR-0010). Same
    # frames / resolution / matching policy as slam_toolbox_params.yaml so the
    # numbers stay comparable to the mapping runs (ADR-0002/0007).
    scan_topic: /scan
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    mode: localization       # loads an existing pose graph, does NOT grow it

    # Serialized pose graph to localize against, built by build_and_save_map.sh
    # from the same deterministic scene (slam_toolbox 2.8.5 writes
    # <name>.posegraph + <name>.data; pass the base name, no extension). Per
    # slam_toolbox 2.8.5 source, localization_slam_toolbox_node ALWAYS
    # deserializes a pose graph (LOCALIZE_AT_POSE); map_file_format: pgm only
    # applies in mapping mode. run_slam_localize_bench.sh substitutes the
    # absolute in-container path here before launching.
    map_file_name: /oomwoo/contributions/compute-benchmark/OsakaTX/scripts/../results/localize_anchor_map
    # Robot's true synthetic trajectory start in map coordinates: the deterministic
    # publisher starts at odom (1.5, 0, yaw=pi/2) and slam seeds map=odom at t0,
    # so this IS the robot's start pose used for LOCALIZE_AT_POSE.
    map_start_pose: [1.5, 0.0, 1.5708]

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    position_covariance_scale: 0.3
    yaw_covariance_scale: 0.3
    transform_publish_period: 0.05
    map_update_interval: 3.0
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.0
    throttle_scans: 1
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    link_search_angle_offset: 0.1
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    enable_interactive_mode: false
