slam_toolbox:
  ros__parameters:
    # OOMWOO benchmark params: 5 Hz scan, small house box room, tight-ish sampling
    # IDENTICAL to slam_toolbox_params.yaml (the async_mapping params used for
    # ADR-0007/0008) so the ONLY experimental difference is the processor:
    # lifelong_slam_toolbox_node (experimental) instead of async_slam_toolbox_node.
    scan_topic: /scan
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    mode: mapping            # fresh mapping session (no pose-graph load)
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    position_covariance_scale: 0.3
    yaw_covariance_scale: 0.3
    transform_publish_period: 0.05
    map_update_interval: 3.0
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.0
    throttle_scans: 1
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    link_search_angle_offset: 0.1

    # Enable debug logs so evaluateNodeDepreciation()'s per-scan activity is
    # observable: node removals are logged at RCLCPP_DEBUG ("Removing node ...")
    # which is suppressed at the default debug_logging: false. This is the ONLY
    # deviation from the async params and is required to evidence whether the
    # node-removal mechanism is actually firing on the synthetic scene.
    debug_logging: true

    # Lifelong (experimental) processor parameters — values VERBATIM from
    # slam_toolbox 2.8.5 config/mapper_params_lifelong.yaml (primary source:
    # https://github.com/SteveMacenski/slam_toolbox/blob/2.8.5/config/mapper_params_lifelong.yaml).
    # In 2.8.5, LifelongSlamToolbox::laserCallback calls evaluateNodeDepreciation()
    # on every scan; any graph node whose objective score falls below
    # lifelong_node_removal_score is AUTOMATICALLY removed from the pose graph
    # (removeFromSlamGraph) — no external trigger. That is the mechanism under
    # test for ADR-0011: does the experimental processor bound the mapping-phase
    # RSS/PSS growth that async mapping shows (+8.05 MiB/min, ADR-0007)?
    lifelong_search_use_tree: false
    lifelong_minimum_score: 0.1
    lifelong_iou_match: 0.85
    lifelong_node_removal_score: 0.04
    lifelong_overlap_score_scale: 0.06
    lifelong_constraint_multiplier: 0.08
    lifelong_nearby_penalty: 0.001
    lifelong_candidates_scale: 0.03
